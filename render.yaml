services:
  - type: web
    name: honeychain-backend
    env: python
    rootDir: polygon/backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: honeychain-db
          property: connectionString
      - key: AMOY_RPC_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: MQTT_HOST
        value: localhost
      - key: BACKEND_BASE_URL
        value: https://honeychain-backend.onrender.com

databases:
  - name: honeychain-db
    databaseName: honeychain
    user: honeychain
    plan: free
